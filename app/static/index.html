<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CareBridge Assistant · RAG demo</title>
<style>
  :root { --bg:#f5f7fa; --card:#fff; --ink:#1b2430; --muted:#6b7686; --brand:#0f766e; --brand-d:#0b5a54;
          --line:#e3e8ee; --warn:#b45309; --warn-bg:#fef3c7; --ok-bg:#dcfce7; --ok:#166534; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#10151c; --card:#18202b; --ink:#e8edf3; --muted:#93a0b2; --line:#263142;
            --warn-bg:#3a2a08; --warn:#fbbf24; --ok-bg:#0f2e1a; --ok:#86efac; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); height:100vh; display:flex; flex-direction:column;
         font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Bengali","Kalpurush",sans-serif; }
  header { padding:14px 20px; background:var(--brand); color:#fff; }
  header h1 { margin:0; font-size:1.05rem; }
  header p { margin:2px 0 0; font-size:.8rem; opacity:.85; }
  #chat { flex:1; overflow-y:auto; padding:18px 12px; max-width:760px; width:100%; margin:0 auto; }
  .msg { margin:10px 0; display:flex; flex-direction:column; }
  .bubble { padding:10px 14px; border-radius:14px; max-width:92%; line-height:1.5; word-wrap:break-word; }
  .user { align-items:flex-end; } .user .bubble { background:var(--brand); color:#fff; border-bottom-right-radius:4px; }
  .bot { align-items:flex-start; } .bot .bubble { background:var(--card); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .badge { display:inline-block; font-size:.7rem; padding:2px 8px; border-radius:999px; margin-top:6px; }
  .badge.ok { background:var(--ok-bg); color:var(--ok); } .badge.no { background:var(--warn-bg); color:var(--warn); }
  details { margin-top:6px; font-size:.8rem; color:var(--muted); max-width:92%; }
  details summary { cursor:pointer; }
  .src { margin:6px 0; padding:8px 10px; background:var(--card); border:1px solid var(--line); border-radius:8px; }
  .src b { color:var(--ink); } .src .sc { float:right; }
  .src pre { margin:6px 0 0; white-space:pre-wrap; font:inherit; color:var(--muted); }
  #chips { display:flex; flex-wrap:wrap; gap:8px; padding:0 12px 8px; max-width:760px; width:100%; margin:0 auto; }
  .chip { border:1px solid var(--line); background:var(--card); color:var(--ink); padding:6px 12px; border-radius:999px;
          font-size:.82rem; cursor:pointer; } .chip:hover { border-color:var(--brand); }
  form { display:flex; gap:8px; padding:10px 12px 6px; max-width:760px; width:100%; margin:0 auto; }
  input[type=text] { flex:1; padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:var(--card);
                     color:var(--ink); font-size:1rem; font-family:inherit; }
  button { border:0; border-radius:10px; padding:0 16px; background:var(--brand); color:#fff; font-size:.95rem; cursor:pointer; }
  button:hover { background:var(--brand-d); } button:disabled { opacity:.5; cursor:default; }
  #mic { background:var(--card); color:var(--ink); border:1px solid var(--line); } #mic.on { background:#dc2626; color:#fff; }
  .tools { display:flex; gap:14px; align-items:center; font-size:.78rem; color:var(--muted);
           padding:0 14px 12px; max-width:760px; width:100%; margin:0 auto; flex-wrap:wrap; }
  .tools select, .tools input { font:inherit; }
  .note { text-align:center; font-size:.72rem; color:var(--muted); padding-bottom:8px; }
</style>
</head>
<body>
<header>
  <h1>CareBridge Assistant</h1>
  <p>Bilingual (বাংলা / English) RAG demo · fictional company · answers come only from the documents</p>
</header>

<div id="chat"></div>
<div id="chips"></div>

<form id="form">
  <button type="button" id="mic" title="Speak your question" hidden>🎤</button>
  <input type="text" id="input" placeholder="Ask in English or বাংলা…" autocomplete="off" maxlength="1000">
  <button type="submit" id="send">Send</button>
</form>
<div class="tools" id="tools" hidden>
  <label>Mic language <select id="lang"><option value="en-US">English</option><option value="bn-BD">বাংলা</option></select></label>
  <label><input type="checkbox" id="tts"> Read answers aloud</label>
  <span>Voice uses your browser (Chrome/Edge); Bangla voice quality varies.</span>
</div>
<div class="note">Demo project. Do not enter personal or medical information.</div>

<script>
const chat = document.getElementById('chat'), input = document.getElementById('input'),
      form = document.getElementById('form'), send = document.getElementById('send');
const sid = (localStorage.sid ||= 's' + Math.random().toString(36).slice(2, 12));

const CHIPS = ["What services does CareBridge offer?", "Where can I get cataract surgery abroad?",
               "How do I book an appointment?", "আপনাদের অফিস কোথায়?", "কমিউনিটি শিল্ড কী?",
               "What is the weather in Dhaka today?"];
const chipsEl = document.getElementById('chips');
CHIPS.forEach(t => { const b = document.createElement('button'); b.type = 'button'; b.className = 'chip';
  b.textContent = t; b.onclick = () => ask(t); chipsEl.appendChild(b); });

const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
const isBn = s => /[\u0980-\u09FF]/.test(s);

function add(role, html, extra) {
  const m = document.createElement('div'); m.className = 'msg ' + role;
  m.innerHTML = `<div class="bubble">${html}</div>` + (extra || '');
  chat.appendChild(m); chat.scrollTop = chat.scrollHeight; return m;
}

async function ask(text) {
  text = text.trim(); if (!text) return;
  chipsEl.style.display = 'none'; input.value = ''; send.disabled = true;
  add('user', esc(text));
  const wait = add('bot', '<i>Thinking…</i>');
  try {
    const r = await fetch('/chat', { method: 'POST', headers: {'Content-Type': 'application/json'},
                                     body: JSON.stringify({ message: text, session_id: sid }) });
    const d = await r.json();
    wait.remove();
    if (!r.ok) { add('bot', esc(d.detail || 'Something went wrong.')); return; }
    const badge = d.grounded ? '<span class="badge ok">answered from documents</span>'
                             : '<span class="badge no">no answer in documents</span>';
    const srcs = (d.sources || []).map((s, i) => `<div class="src"><b>[${i + 1}] ${esc(s.source)}</b>
        <span class="sc">${s.score}</span><br><small>${esc(s.heading)}</small><pre>${esc(s.text)}</pre></div>`).join('');
    add('bot', fmt(d.answer) + '<br>' + badge,
        srcs ? `<details><summary>Sources (${d.sources.length}) · model: ${esc(d.model || '-')}</summary>${srcs}</details>` : '');
    speak(d.answer);
  } catch (e) { wait.remove(); add('bot', 'Network error. Please try again.'); }
  finally { send.disabled = false; input.focus(); }
}
form.onsubmit = e => { e.preventDefault(); ask(input.value); };

// ---- optional browser voice (no server, no API key) ----
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const mic = document.getElementById('mic'), tts = document.getElementById('tts'), lang = document.getElementById('lang');
if (SR || 'speechSynthesis' in window) document.getElementById('tools').hidden = false;
if (SR) {
  mic.hidden = false;
  const rec = new SR(); rec.interimResults = false; rec.maxAlternatives = 1;
  rec.onresult = e => ask(e.results[0][0].transcript);
  rec.onend = () => mic.classList.remove('on');
  rec.onerror = () => mic.classList.remove('on');
  mic.onclick = () => { rec.lang = lang.value; mic.classList.add('on'); try { rec.start(); } catch (_) {} };
}
function speak(text) {
  if (!tts.checked || !('speechSynthesis' in window)) return;
  const clean = text.replace(/\[\d+\]/g, '').replace(/\*\*/g, '');
  const u = new SpeechSynthesisUtterance(clean); u.lang = isBn(clean) ? 'bn-BD' : 'en-US';
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

add('bot', 'Hi! Ask me about CareBridge’s services, partner hospitals, doctors or the Community Shield programme. ' +
           'আপনি বাংলাতেও প্রশ্ন করতে পারেন।');
</script>
</body>
</html>
